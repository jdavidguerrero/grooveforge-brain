[project]
name = "gf-motor"
version = "0.1.0"
description = "Motor de asistencia de GrooveForge: flujo con Ableton Live, solo local"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
