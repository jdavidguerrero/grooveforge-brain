[project]
name = "gf-consola"
version = "0.1.0"
description = "Prototipo de la consola GrooveForge: reproductor y pruebas en el Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.12", "sounddevice>=0.5"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
