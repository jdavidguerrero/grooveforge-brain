[project]
name = "gf-perc"
version = "0.4.0"
description = "Generador de percusión orgánica por síntesis modal, fuera de tiempo real"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "soundfile>=0.12"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
