[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

lib_deps =
    PaulStoffregen/Audio
    PaulStoffregen/Encoder
    PaulStoffregen/Bounce2
    PaulStoffregen/USBHost_t36

build_flags =
    -DUSB_MIDI_AUDIO_SERIAL
    -std=gnu++17

monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
