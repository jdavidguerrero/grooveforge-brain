; ── Sketch anterior (referencia — no activo) ────────────────────────────────
[env:sketch27]
extends = env:teensy41
build_src_filter =
    +<sketches/27-fx-selector.cpp>
    +<fx/ghost_echo.cpp>
    +<fx/modal_reverb.cpp>
    +<fx/phase_chorus.cpp>
    +<fx/bit_sculpt.cpp>
    +<fx/tape_saturate.cpp>
    +<fx/cymatic_resonator.cpp>
    +<fx/granular_cloud.cpp>
    +<fx/spring_plate.cpp>
    +<fx/sub_genesis.cpp>
    +<ui/encoders.cpp>
    +<ui/buttons.cpp>
    +<usb/midi_host.cpp>
    +<bridge/bridge_master.cpp>

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
