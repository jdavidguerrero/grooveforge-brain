[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Audio, Encoder, Bounce2 y USBHost_t36 vienen incluidas con Teensyduino
; (framework-arduinoteensy) — el LDF las resuelve al hacer #include, sin lib_deps.

build_flags =
    -DUSB_MIDI_AUDIO_SERIAL
    -std=gnu++17

build_src_filter = +<*> -<sketches/>

monitor_speed = 115200

[env:sketch]
extends = env:teensy41
build_src_filter = +<sketches/10-bit-sculpt.cpp> +<fx/bit_sculpt.cpp>

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
