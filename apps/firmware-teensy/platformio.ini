    +<bridge/bridge_master.cpp>
    +<ml/key_detector.cpp>
    +<ml/chord_recognizer.cpp>
    +<ml/beat_follower.cpp>
    +<ml/scale_lock.cpp>
    +<ml/ml_engine.cpp>
    +<ml/auto_harmonize.cpp>
    +<ml/smart_arp.cpp>
    +<ml/groove.cpp>
    +<ml/velocity_learn.cpp>
    +<ui/led_ring.cpp>
    +<ui/device_state.cpp>
    +<audio/audio_graph.cpp>
    +<audio/moog_ladder.cpp>
    +<fx/fx_manager.cpp>
