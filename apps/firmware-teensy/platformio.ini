[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; Audio, Encoder, Bounce2 y USBHost_t36 vienen incluidas con Teensyduino
; (framework-arduinoteensy) — el LDF las resuelve al hacer #include, sin lib_deps.
; FastLED se agrega explícitamente porque no es parte del bundle de Teensyduino.
;
; TFLite Micro (Sprint 4.3 — Key Detector):
;   Para el env:teensy41 de producción, agregar TFLite Micro via vendoring:
;   1. Clonar tflite-micro: git clone https://github.com/tensorflow/tflite-micro
;   2. Ejecutar el script de generación de árbol Arduino:
;      python tensorflow/lite/micro/tools/project_generation/create_tflm_tree.py --output_dir=lib/tflite-micro/
;   3. PlatformIO detecta la lib automáticamente vía lib/
;   El env:sketch no incluye ml/key_detector.cpp (build_src_filter explícito)
;   así que el build de sprint funciona sin TFLite instalado.
lib_deps =
    fastled/FastLED @ ^3.7.0

build_flags =
    -DUSB_MIDI_AUDIO_SERIAL
    -std=gnu++17
    ; protocol.h es un header compartido entre Teensy y ESP32.
    ; Lo incluimos via -I porque es un header suelto, no una librería PlatformIO.
    -I../../apps/bridge-protocol/include
    ; TFLite Micro vendorizado en lib/tflite-micro/ (Sprint 5.1)
    ; -I lib/tflite-micro necesario para que los includes estilo
    ; "tensorflow/lite/micro/..." resuelvan desde la raíz del árbol vendorizado.
    ; -I lib/tflite-micro/third_party/flatbuffers/include resuelve "flatbuffers/flatbuffers.h".
    -DTF_LITE_STATIC_MEMORY
    -fno-rtti
    -fno-exceptions
    -I lib/tflite-micro
    -I lib/tflite-micro/third_party/flatbuffers/include
    -O2

build_src_filter = +<*> -<sketches/>

monitor_speed = 115200

; ── Sketch activo (único env de desarrollo — se actualiza cada sprint) ──────
; Sprint actual: Sprint 36 Batch E — FxManager (dynamic FX instantiation)
; Sprint anterior: Sprint 35 — LED ring WS2812B + EEPROM persistence
; Para flashear: pio run -e sketch -t upload
; Historial de sketches anteriores en src/sketches/ (no se borran, solo inactivos)
[env:sketch]
extends = env:teensy41
build_src_filter =
    +<sketches/28-synth-navigator.cpp>
    +<engines/moog_model_d.cpp>
    +<engines/juno_106.cpp>
    +<engines/prophet_5.cpp>
    +<engines/ob6.cpp>
    +<engines/dx7.cpp>
    +<engines/arp2600.cpp>
