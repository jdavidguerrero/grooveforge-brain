; Waveshare ESP32-S3-Touch-LCD-1.28
; default_envs: pio run sin argumento solo compila esp32s3.
; El env native es exclusivo para tests: pio test -e native
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    lvgl/lvgl @ ^8.3.0
    ; LovyanGFX reemplaza TFT_eSPI — compatible con Arduino ESP32 v3.x (IDF 5.x).
    ; TFT_eSPI 2.5.x crashea en Arduino ESP32 v3.x porque spiStartBus() retorna
    ; NULL para el SPI bus en IDF5 (spi_t->dev queda NULL → StoreProhibited @ 0x10).
    ; LovyanGFX tiene soporte nativo para ESP32-S3 + GC9A01 + LVGL 8.
    lovyan03/LovyanGFX @ ^1.1.16

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include

upload_speed = 921600
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
