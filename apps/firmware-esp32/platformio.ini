; Waveshare ESP32-S3-Touch-LCD-1.28
; default_envs: pio run sin argumento solo compila esp32s3.
; El env native es exclusivo para tests: pio test -e native
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    lvgl/lvgl @ ^8.3.0
    ; TFT_eSPI con USER_SETUP_LOADED=1 — todos los pines via build_flags.
    ; Sin USER_SETUP_LOADED TFT_eSPI carga su User_Setup.h por defecto con pines
    ; incorrectos → spiStartBus() recibe un bus_num invalido en IDF5 → spi->dev=NULL
    ; → StoreProhibited @ 0x10. Con USER_SETUP_LOADED+GC9A01_DRIVER+USE_HSPI_PORT
    ; la inicializacion SPI toma el path correcto para ESP32-S3.
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; ── TFT_eSPI pin config — Waveshare ESP32-S3-Touch-LCD-1.28 ──────────────
    ; USER_SETUP_LOADED=1: deshabilita la carga de User_Setup.h — todos los
    ; parametros vienen de estos build flags. CRITICO para evitar el crash.
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=12
    -DTFT_BL=40
    -DTFT_BACKLIGHT_ON=1
    -DTFT_MISO=-1
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=16000000

upload_speed = 921600
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
