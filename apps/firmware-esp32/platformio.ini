; Waveshare ESP32-S3-Touch-LCD-1.28
; default_envs: pio run sin argumento solo compila esp32s3.
; El env native es exclusivo para tests: pio test -e native
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    lvgl/lvgl @ ^8.3.0
    Bodmer/TFT_eSPI @ ^2.5.0

build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DLV_CONF_INCLUDE_SIMPLE
    ; Ruta explicita para que lv_conf.h llegue a la compilacion de la libreria LVGL.
    ; PlatformIO incluye include/ para codigo del proyecto pero no siempre lo propaga
    ; a las librerias de terceros cuando usan __has_include() internamente.
    -I include
    ; ── TFT_eSPI: GC9A01 240×240 via SPI — Waveshare ESP32-S3-Touch-LCD-1.28 ──
    ; USER_SETUP_LOADED=1 le dice a TFT_eSPI que ignore su propio User_Setup.h
    ; y use solo las defines del build system. Mas limpio con PlatformIO.
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=11
    -DTFT_SCLK=10
    -DTFT_CS=9
    -DTFT_DC=8
    -DTFT_RST=12
    -DTFT_BL=40
    -DTFT_BACKLIGHT_ON=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000

upload_speed = 921600
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DNATIVE_TEST
