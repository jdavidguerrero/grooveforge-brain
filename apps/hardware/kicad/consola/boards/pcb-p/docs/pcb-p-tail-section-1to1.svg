<text x="7" y="6" font-size="3">PCB-P · sección radial de una cola · escala 1:1</text>
<text x="7" y="11" font-size="2.1">Misma sección para los seis sensores; girada 25° en planta, 205° para V4.</text>
<rect x="15.7" y="26" width="19.950000000000003" height="1.6" fill="#ddd" stroke="black" stroke-width="0.1"/>
