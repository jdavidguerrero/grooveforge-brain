<path d="M34 25.77h1 a2.5 2.5 0 0 1 2.5 2.5 v10.33 a2.5 2.5 0 0 0 2.5 2.5 h8.789027549038275 a2.5 2.5 0 0 0 2.5 -2.5 v-5.5" fill="none" stroke="#222" stroke-width="0.46"/>
<text x="7" y="22" font-size="2">Disco Ø18,3</text>
<text x="57" y="29" font-size="2">Socket inferior H=8,5</text>
<text x="57" y="34" font-size="2">Boca a TOP −16,6</text>
<text x="57" y="39" font-size="2">Inserción nominal: 3</text>
<text x="7" y="46" font-size="2.1">P superior = TOP −6,5; espesor = 1,6; K inferior = TOP −5,0. Luz superior: 1,5.</text>
<text x="7" y="51" font-size="2.1">L = 37.4 = 1 + 3πR/2 + V + B + R + 3; R = 2.5; V = 10.33; B = 8.789.</text>
<text x="7" y="56" font-size="2.1">D centro disco → eje socket = 9,15 + 1 + B + 3R = 26.439. Cola hasta TOP −21,83.</text>
<text x="7" y="61" font-size="2.1">No marcar la película ni tapar su respiradero. Recortar metal/soldadura superior a ≤0,8.</text>
<text x="7" y="66" font-size="2.1">37,4 se interpreta desde borde de disco a punta metálica. Comprobar inserción y recorrido con pieza real.</text>
