<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"></helmet>
<div style="width:440px;font-family:'IBM Plex Sans',sans-serif;color:#C8C8C8;display:flex;flex-direction:column;gap:20px;padding-top:34px">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#7A7A7A;padding-bottom:4px">{{ g.t }}</div>
      <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
        <div style="display:grid;grid-template-columns:132px minmax(0,1fr);gap:12px;font-size:12.5px;line-height:18px;border-top:1px solid #262626;padding-top:4px">
          <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#F2F2F2">{{ r.a }}</span><span style="text-wrap:pretty">{{ r.b }}</span>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:480},&quot;n&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const n = this.props.n || {};
    const g = (t, a) => ({ t, rows: (a || []).map(([a, b]) => ({ a, b })) });
    return { groups: [g('PHYSICAL CONTROLS', n.c), g('ANIMATED REGIONS', n.a), g('DATA SOURCES', n.d), g('LAYOUT SPEC · X,Y · W×H (PX)', n.s)].filter(x => x.rows.length) };
  }
}
</script>
</body>
</html>
