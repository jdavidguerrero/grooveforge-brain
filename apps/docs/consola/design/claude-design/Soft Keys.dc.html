<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@500;600;700;800&family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet"></helmet>
<div style="width:100%;height:96px;box-sizing:border-box;background:{{ barBg }};border-top:1px solid #1C1C1C;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;padding:8px">
  <sc-for list="{{ ks }}" as="k" hint-placeholder-count="8">
    <div style="position:relative;box-sizing:border-box;height:80px;border-radius:6px;background:{{ k.cap }};border:1px solid {{ k.bd }};box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 2px 0 #000;padding:16px 12px 10px;display:flex;flex-direction:column;justify-content:space-between;min-width:0">
      <div style="position:absolute;left:12px;right:12px;top:6px;height:4px;border-radius:2px;background:{{ k.led }};box-shadow:{{ k.glow }}"></div>
      <div style="font-family:{{ labelFont }};font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:{{ k.lc }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.l }}</div>
      <div style="font-family:{{ valueFont }};font-size:18px;line-height:22px;font-weight:600;color:{{ k.vc }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ k.v }}</div>
      <sc-if value="{{ k.hasP }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:12px;right:12px;bottom:5px;height:2px;background:#2A2A2A;border-radius:1px"><div style="width:{{ k.pp }}%;height:100%;background:{{ k.pc }}"></div></div></sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:96},&quot;brand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gf&quot;,&quot;gp&quot;],&quot;default&quot;:&quot;gf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;keys&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{l:string,v?:string,c?:string,d?:string,on?:boolean,turn?:boolean,ai?:boolean,off?:boolean,p?:number}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, gp = p.brand === 'gp';
    const def = Array.from({ length: 8 }, (_, i) => ({ l: 'ENC ' + (i + 1), v: '' }));
    const keys = (p.keys ?? def).slice(0, 8);
    const ks = keys.map(k => {
      const c = k.c ?? (gp ? '#00D4AA' : '#5DCAA5');
      const lit = k.on || k.turn;
      let led = k.off ? '#1A1A1A' : k.ai ? '#7A6FE0' : lit ? c : (k.d ?? '#333338');
      const glowing = !k.off && (lit || k.ai);
      return {
        l: k.l ?? '', v: k.v ?? '',
        led, glow: glowing ? `0 0 10px ${led}, 0 0 3px ${led}` : 'none',
        cap: k.off ? '#121212' : (gp ? 'linear-gradient(180deg,#1C1C21 0%,#141418 100%)' : 'linear-gradient(180deg,#1F1F1F 0%,#161616 100%)'),
        bd: k.turn ? c : (gp ? '#27272A' : '#2A2A2A'),
        lc: k.off ? '#34343C' : k.ai ? '#A9A0F2' : lit ? '#F2F2F2' : '#9A9AA6',
        vc: k.off ? '#34343C' : k.turn ? c : '#F2F2F2',
        hasP: k.p != null, pp: Math.round((k.p ?? 0) * 100), pc: c
      };
    });
    return {
      ks,
      barBg: gp ? '#09090B' : '#0A0A0A',
      labelFont: gp ? "'General Sans',sans-serif" : "'IBM Plex Mono',monospace",
      valueFont: gp ? "'JetBrains Mono',monospace" : "'IBM Plex Mono',monospace"
    };
  }
}
</script>
</body>
</html>
