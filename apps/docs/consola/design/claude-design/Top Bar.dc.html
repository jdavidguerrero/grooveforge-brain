<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Big+Shoulders+Display:wght@500;600;700;800&family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap" rel="stylesheet"></helmet>
<div style="width:100%;height:56px;box-sizing:border-box;background:{{ bg }};border-bottom:1px solid #1C1C1C;display:flex;align-items:center;gap:28px;padding:0 20px;font-family:{{ monoF }};color:#F2F2F2">
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
    <span style="font-size:10px;line-height:12px;letter-spacing:.16em;color:#5A5A6E">{{ mode }}</span>
    <span style="font-family:{{ viewF }};font-stretch:{{ viewW }};font-size:{{ viewSize }}px;line-height:26px;font-weight:700;letter-spacing:.02em;text-transform:{{ viewCase }};white-space:nowrap">{{ view }}</span>
  </div>
  <div style="flex:1"></div>
  <sc-if value="{{ showMusic }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;align-items:center;gap:24px">
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;letter-spacing:.14em;color:#5A5A6E">KEY</span><span style="font-size:16px;line-height:18px;font-weight:600">{{ keyName }}</span></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;letter-spacing:.14em;color:#5A5A6E">BPM</span><div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:16px;line-height:18px;font-weight:600">{{ bpm }}</span><span style="font-size:10px;font-weight:600;letter-spacing:.08em;color:{{ linkC }}">{{ linkTxt }}</span></div></div>
      <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:10px;letter-spacing:.14em;color:#5A5A6E">BAR</span><span style="font-size:16px;line-height:18px;font-weight:600">{{ bar }}</span></div>
      <div style="display:flex;flex-direction:column;gap:5px"><span style="font-size:10px;letter-spacing:.14em;color:#5A5A6E">PHRASE {{ phrase }}/8</span><div style="display:flex;gap:3px"><sc-for list="{{ pips }}" as="q" hint-placeholder-count="8"><div style="width:10px;height:10px;border-radius:2px;background:{{ q.c }}"></div></sc-for></div></div>
      <div style="height:32px;padding:0 12px;display:flex;align-items:center;border-radius:4px;background:#1C1C1C;border:1px solid #2E2E2E;font-family:var(--disp);font-stretch:var(--dispw);font-size:20px;font-weight:700;letter-spacing:.06em">{{ section }}</div>
    </div>
    <div style="width:1px;height:28px;background:#242424"></div>
  </sc-if>
  <div style="display:flex;align-items:center;gap:14px">
    <sc-for list="{{ conns }}" as="c" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;gap:6px"><div style="width:8px;height:8px;border-radius:50%;background:{{ c.c }};box-shadow:{{ c.g }}"></div><span style="font-size:10px;font-weight:600;letter-spacing:.1em;color:{{ c.tc }}">{{ c.n }}</span></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:56},&quot;brand&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gf&quot;,&quot;gp&quot;],&quot;default&quot;:&quot;gf&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;STANDALONE&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;LIVE · SESSION&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showMusic&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;keyName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;A MIN&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bpm&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;124.0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;link&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;bar&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;37&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phrase&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;min&quot;:1,&quot;max&quot;:8,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;section&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;INTRO&quot;,&quot;BUILD&quot;,&quot;DROP&quot;,&quot;BREAK&quot;,&quot;INTER&quot;,&quot;OUTRO&quot;],&quot;default&quot;:&quot;DROP&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;conn&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{n:string,s:'ok'|'warn'|'down'|'off'}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, gp = p.brand === 'gp';
    const ph = p.phrase ?? 5;
    const ok = gp ? '#10B981' : '#1D9E75';
    const C = { ok, warn: '#E8B84A', down: '#E84A4A', off: '#3A3A44' };
    const conns = (p.conn ?? [{ n: 'BRAIN', s: 'ok' }, { n: 'LINK', s: 'ok' }, { n: 'LIVE', s: 'off' }, { n: 'NET', s: 'ok' }])
      .map(c => ({ n: c.n, c: C[c.s], g: c.s === 'ok' || c.s === 'off' ? 'none' : `0 0 6px ${C[c.s]}`, tc: c.s === 'off' ? '#5A5A6E' : c.s === 'ok' ? '#9A9AA6' : C[c.s] }));
    return {
      bg: gp ? '#09090B' : '#0A0A0A',
      monoF: gp ? "'JetBrains Mono',monospace" : "'IBM Plex Mono',monospace",
      viewF: gp ? "'General Sans',sans-serif" : 'var(--disp)',
      viewW: gp ? '100%' : 'var(--dispw)',
      viewSize: gp ? 20 : 26, viewCase: gp ? 'none' : 'uppercase',
      mode: p.mode ?? 'STANDALONE', view: p.view ?? 'LIVE · SESSION',
      showMusic: p.showMusic ?? true,
      keyName: p.keyName ?? 'A MIN', bpm: p.bpm ?? '124.0',
      linkTxt: p.link === 0 ? 'NO LINK' : `LINK ${p.link ?? 3}`, linkC: p.link === 0 ? '#5A5A6E' : '#5DCAA5',
      bar: p.bar ?? '37', phrase: ph, section: p.section ?? 'DROP',
      pips: Array.from({ length: 8 }, (_, i) => ({ c: i < ph - 1 ? '#1D9E75' : i === ph - 1 ? '#F2F2F2' : '#242424' })),
      conns
    };
  }
}
</script>
</body>
</html>
