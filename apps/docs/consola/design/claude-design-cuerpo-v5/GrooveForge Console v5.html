    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px\"><div style=\"background:#161616;border:1px solid #262626;padding:20px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">CUERPO<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#F2F2F2\">340 × 340 × 90<\u002Fdiv><div style=\"font-size:13px;color:#A8A8A8\">bloque macizo, alto parejo: 85 de cuerpo + 5 de patas · cantos R5<\u002Fdiv><\u002Fdiv><div style=\"background:#161616;border:1px solid #262626;padding:20px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">CSV<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#F2F2F2\">{{ csvTxt }}<\u002Fdiv><div style=\"font-size:13px;color:#A8A8A8\">controles en la coordenada del CSV; solo se movieron los 19 que pediste<\u002Fdiv><\u002Fdiv><div style=\"background:#161616;border:1px solid #262626;padding:20px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">PI Y DSI<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#F2F2F2\">FFC de 200 mm<\u002Fdiv><div style=\"font-size:13px;color:#A8A8A8\">Pi en el piso, pegada al borde izquierdo del módulo · ~{{ dsiLen }} mm con una curva de R 20<\u002Fdiv><\u002Fdiv><div style=\"background:#161616;border:1px solid #262626;padding:20px;display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">CHOQUES<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:24px;font-weight:600;color:#E8B84A\">{{ clashTxt }}<\u002Fdiv><div style=\"font-size:13px;color:#A8A8A8\">ningún ajuste aplicado al CSV; ver sección 8<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 48px;font-size:14px;line-height:22px;color:#C8C8C8;max-width:1500px\"><div><span style=\"color:#F2F2F2;font-weight:600\">90 mm, y de dónde sale.<\u002Fspan> 5 de patas + 3 de piso + 3 de separadores + 60 de apilado + 10.4 de margen + 8.6 desde la punta de los pines Choc hasta la cara superior. La bahía queda bajo la columna de navegación, y sus pines son lo más bajo que hay encima.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Por qué la Pi no va debajo del módulo.<\u002Fspan> Bajo el módulo (14.8 + 2 de chapa) el cuerpo subiría a 98 mm. Al lado, con solo los USB bajo el módulo, son 90. El costo es un DSI de ~150 mm en vez de ~80; sigue siendo el FFC de 200.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Pi a la izquierda, eje largo hacia la pantalla.<\u002Fspan> x 9–94, y 219–275. El conector DISP queda a la altura del centro del módulo (y 267) y el flex sale en la dirección en que ya apunta: sube detrás del borde del HAT y entra bajo el módulo con una sola curva.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Cuerpo igual a la chapa: 340 × 340.<\u002Fspan> Pared de 3 a ras del aluminio, sin ceja. En una cama de 350 quedan 5 mm por lado: entra en una pieza si el servicio imprime sin borde de adherencia. Si no, el corte mínimo es uno solo, en x 138, escondido en el tabique de la bahía.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">PCB-K más chica que la estimada.<\u002Fspan> Propongo un contorno de 246 × 292 en vez de ~330 × 300: a la derecha de las escenas no hay teclas, así que faders, jog y pots quedan fuera y no necesitan ventanas. Las únicas ventanas son la M4 y 4 redondas para los FSR de velocity.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">PCB-M: 186 × 60, contra la pared trasera, a la derecha.<\u002Fspan> x 140–326, y 276–336, bajo el borde del módulo y del Sharp derecho. 5 jacks de 1/4\" a paso 24 y 4 de 3.5 a paso 18 en su borde. Separada de la bahía por el tabique de x 136.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">La chapa se atornilla desde abajo.<\u002Fspan> 9 separadores PEM de 10 en la chapa y 9 torres con pozo en el cuerpo: tornillos M3 × 10 con destornillador largo, sin nada a la vista arriba. Todo lo del panel cuelga de la chapa; en el cuerpo quedan la Pi, PCB-M y los conectores.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Un keycap de 13.5, dos alturas.<\u002Fspan> El mismo molde. Para el transporte, un inserto de 1 mm en el fondo de la cavidad y un núcleo con la máscara 0.4 más delgada: sale 1 mm más bajo con la misma huella.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">1<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Vista superior · 1:1 · directo del CSV<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Cada control se dibuja leyendo x_mm, y_mm de su fila. Debajo, en punteado, lo que agregué: Pi, tabiques, PCB-M y DSI<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:40px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Vista superior con los controles en las coordenadas del CSV\" width=\"{{ topW }}\" height=\"{{ topH }}\" sc-camel-view-box=\"{{ topVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ topS }}\" as=\"s\" hint-placeholder-count=\"170\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ topT }}\" as=\"t\" hint-placeholder-count=\"170\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:300px;display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:20px;color:#B8B8B8\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">VERIFICACIÓN CONTRA EL CSV<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2;display:grid;grid-template-columns:110px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Filas<\u002Fspan><span>{{ nRows }} (83 controles, 3 contornos, 1 jack)<\u002Fspan><span style=\"color:#9FE1CB\">Dibujados<\u002Fspan><span>{{ nCtl }} controles<\u002Fspan><span style=\"color:#9FE1CB\">Movidos<\u002Fspan><span>{{ nMoved }}<\u002Fspan><span style=\"color:#9FE1CB\">Agregados<\u002Fspan><span>0<\u002Fspan><span style=\"color:#9FE1CB\">Quitados<\u002Fspan><span>0<\u002Fspan><\u002Fdiv><div><span style=\"color:#F2F2F2\">Ajustes pedidos.<\u002Fspan> BACK · MENU · ◀ · ▶ · BROWSE bajan 5 mm (y 305 → 231): la columna queda centrada en la pantalla, en y 268, y va de 224.25 a 311.75, a ras del área activa (224–312). CUE · FILL · TAP bajan a y 174 y BUILD · DROP · BREAK a y 155: TAP pasa de 5.3 a 8.0 mm de la perilla E1, y BUILD queda a 9 mm de SHIFT. PCB-K baja el escalón de su brazo izquierdo a y 221 y un agujero de montaje pasa a (30, 144).<\u002Fdiv><div><span style=\"color:#F2F2F2\">Encoders +2 (y 190 → 192), y no más.<\u002Fspan> Hay dos topes casi iguales. Regla 5: con la yema a 20 mm sobre la perilla y la vista a 42°, hacen falta 22.2 mm entre el borde de la perilla y el área activa; quedan 23.0. PCB-A (supuesta de 30 mm centrada en los EC11) queda a 0.9 mm del módulo, que va a la misma profundidad. Para subir más: verificar dónde están los EC11 dentro de PCB-A (si el eje está a ≤ 9 mm de su borde trasero, la placa ya no limita) y aceptar que la yema tape el borde inferior de la franja de soft-keys.<\u002Fdiv><div>La geometría carga el CSV y no tiene coordenadas de controles propias. La tabla de la sección 6 repite las 26 teclas con la x, y que lee PCB-K.<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">LEYENDA<\u002Fdiv><div>Blanco: corte CNC. Verde y violeta: keycap de 13.5 según su zona de LED; trazo cortado = transporte, 1 mm más bajo. Rojo: FSR de expresión. Ámbar punteado: Sharp con orejas (44.5). Violeta punteado: Pi, tapa de la bahía y tabiques. Ámbar: PCB-M en el piso. Verde grueso: DSI.<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">CORTES CNC<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2;display:grid;grid-template-columns:120px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Ventana<\u002Fspan><span>158 × 91 · R1, centrada en MOD<\u002Fspan><span style=\"color:#9FE1CB\">Choc × 26<\u002Fspan><span>14 × 14 + rebaje 16 × 16 × 0.8 por debajo<\u002Fspan><span style=\"color:#9FE1CB\">EC11 × 9<\u002Fspan><span>Ø 7.1 (8 encoders + jog)<\u002Fspan><span style=\"color:#9FE1CB\">Pots × 3<\u002Fspan><span>Ø 7.1<\u002Fspan><span style=\"color:#9FE1CB\">Pads × 32<\u002Fspan><span>11 × 11 R1<\u002Fspan><span style=\"color:#9FE1CB\">Faders × 4<\u002Fspan><span>3 × 63 R1.5, paso 20<\u002Fspan><span style=\"color:#9FE1CB\">FSR × 6<\u002Fspan><span>25.6 × 25.6 R3<\u002Fspan><span style=\"color:#9FE1CB\">Sharp × 2<\u002Fspan><span>31 × 14.5 R1, acrílico IR de 1.5<\u002Fspan><span style=\"color:#9FE1CB\">Selector<\u002Fspan><span>10 × 4 R1<\u002Fspan><span style=\"color:#9FE1CB\">PEM<\u002Fspan><span>9 separadores M3 × 10 (cuerpo) + espárragos para las placas (sección 6)<\u002Fspan><span style=\"color:#9FE1CB\">Canto<\u002Fspan><span>R5 en las 4 esquinas, igual que el cuerpo<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">2<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Cortes con todas las alturas · 1:1<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Arriba: corte lateral (frente a la izquierda), proyectado en x. Abajo: corte transversal por y 247, donde el apilado y el DSI se ven en verdadera magnitud<\u002Fspan><\u002Fdiv>\n<div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte lateral con las alturas de todas las placas\" width=\"{{ secAW }}\" height=\"{{ secAH }}\" sc-camel-view-box=\"{{ secAVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ secAS }}\" as=\"s\" hint-placeholder-count=\"40\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ secAT }}\" as=\"t\" hint-placeholder-count=\"40\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv>\n<div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte transversal con el apilado de la Pi, el DSI y el aire\" width=\"{{ secBW }}\" height=\"{{ secBH }}\" sc-camel-view-box=\"{{ secBVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ secBS }}\" as=\"s\" hint-placeholder-count=\"40\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ secBT }}\" as=\"t\" hint-placeholder-count=\"40\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px;font-size:13px;line-height:20px;color:#B8B8B8\"><div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">ALTO: DE DÓNDE SALE CADA MM<\u002Fdiv><div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) 60px 70px minmax(0,1fr);font-size:12.5px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">TRAMO<\u002Fdiv><div style=\"padding:8px 0\">MM<\u002Fdiv><div style=\"padding:8px 0\">ACUM.<\u002Fdiv><div style=\"padding:8px 0\">POR QUÉ<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ stackV }}\" as=\"s\" hint-placeholder-count=\"6\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#F2F2F2\">{{ s.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#5DCAA5\">{{ s.v }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ s.a }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ s.m }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><div>Si el apilado real mide 55, el margen sube a 15; con 65 quedan 5. Pasado 70, la tapa de la bahía se reimprime como bandeja 4 mm más honda (hay 5 bajo el cuerpo). Las 4 varillas M2.5 × 70 con tuercas fijan cada nivel a la altura que resulte.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">BAJO LA CARA SUPERIOR (mm)<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2;display:grid;grid-template-columns:88px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">0 – 2<\u002Fspan><span>Aluminio (1.2 en los rebajes Choc)<\u002Fspan><span style=\"color:#9FE1CB\">2 – 16.8<\u002Fspan><span>Módulo de pantalla, vidrio a ras<\u002Fspan><span style=\"color:#9FE1CB\">2 – 3.3<\u002Fspan><span>Ala de las tapas de FSR<\u002Fspan><span style=\"color:#9FE1CB\">3.4 – 5<\u002Fspan><span>PCB-K · pines Choc hasta 8.6<\u002Fspan><span style=\"color:#9FE1CB\">6.5 – 8.1<\u002Fspan><span>PCB-P<\u002Fspan><span style=\"color:#9FE1CB\">8.5 – 10.1<\u002Fspan><span>NeoTrellis M4 · fichas hasta ~16<\u002Fspan><span style=\"color:#9FE1CB\">2.5 – 9.5<\u002Fspan><span>Cuerpo de los RS6011<\u002Fspan><span style=\"color:#9FE1CB\">9.5 – 11.1<\u002Fspan><span>PCB-F<\u002Fspan><span style=\"color:#9FE1CB\">12 – 13.6<\u002Fspan><span>PCB-A · pines EC11 hasta 16<\u002Fspan><span style=\"color:#9FE1CB\">2 – 14<\u002Fspan><span>Jog y pots, montados en el panel<\u002Fspan><span style=\"color:#9FE1CB\">12 – 25.5<\u002Fspan><span>Sharp, lente a −10<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:10px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">DESDE LA BASE DEL CUERPO (zb)<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2;display:grid;grid-template-columns:88px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">0 – 3<\u002Fspan><span>Piso y tapa de la bahía<\u002Fspan><span style=\"color:#9FE1CB\">6 – 7.6<\u002Fspan><span>Pi 5<\u002Fspan><span style=\"color:#9FE1CB\">7.6 – 17<\u002Fspan><span>Active Cooler<\u002Fspan><span style=\"color:#9FE1CB\">17 – 23.6<\u002Fspan><span>Aire sobre el cooler: 6.6 (a verificar)<\u002Fspan><span style=\"color:#9FE1CB\">23.6 – 56<\u002Fspan><span>HAT NVMe y Audio+ V2 (estimado)<\u002Fspan><span style=\"color:#9FE1CB\">66<\u002Fspan><span>Tope estimado del apilado<\u002Fspan><span style=\"color:#9FE1CB\">66 – 76.4<\u002Fspan><span>Margen<\u002Fspan><span style=\"color:#9FE1CB\">8 – 9.6<\u002Fspan><span>PCB-M sobre torres de 5<\u002Fspan><span style=\"color:#9FE1CB\">9.6 – 29.6<\u002Fspan><span>Teensy 4.1 + Audio Shield<\u002Fspan><span style=\"color:#9FE1CB\">17<\u002Fspan><span>Eje de los jacks traseros<\u002Fspan><span style=\"color:#9FE1CB\">40<\u002Fspan><span>Eje del jack de audífonos<\u002Fspan><span style=\"color:#9FE1CB\">68.2<\u002Fspan><span>Cara inferior del módulo<\u002Fspan><span style=\"color:#9FE1CB\">83 – 85<\u002Fspan><span>Aluminio<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">3<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Flex DSI y ventilación<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;font-size:14px;line-height:22px;color:#C8C8C8;max-width:1500px\"><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">DSI: FFC DE 200 MM<\u002Fdiv><div>Recorrido ~{{ dsiLen }} mm, dibujado en el corte transversal: 17 inclinados desde el conector DISP hasta el hueco entre el borde del HAT y la parte trasera de los USB, 24 de subida recta a 2 mm del borde del módulo, una curva de R 20 (31 mm) y 76 horizontales bajo el módulo hasta su centro. Sobran {{ dsiSpare }} mm para un lazo flojo.<\u002Fdiv><div>El cable nunca cambia de plano ni se pliega: sale de la Pi apuntando hacia la pantalla y llega al módulo en la misma dirección. Pasa sobre el tabique por una ranura de 6 mm bajo el módulo.<\u002Fdiv><div>Todo depende de dónde esté el conector del módulo, que no he medido. Supuse el centro. Si está cerca del borde izquierdo, el recorrido baja a ~{{ dsiNear }} mm. Si está en el borde derecho, sube a ~{{ dsiFar }} y hay que pasar al FFC de 300, con el sobrante en un lazo plano bajo el módulo.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">AIRE: ENTRA {{ inA }} cm² · SALE {{ exA }} cm²<\u002Fdiv><div><span style=\"color:#F2F2F2\">Entrada, abajo:<\u002Fspan> 12 ranuras de 3 × 40 en la tapa de la bahía, bajo el Active Cooler. Las patas de 5 mm dejan 68 cm² de paso lateral por los cuatro lados, así que la tapa no se ahoga sobre una mesa lisa; sobre una tela, sí.<\u002Fdiv><div><span style=\"color:#F2F2F2\">Camino:<\u002Fspan> el ventilador toma el aire del hueco de 6.6 mm entre cooler y HAT, lo empuja contra el disipador y sale por los costados del apilado hacia la pared trasera, 62 mm más atrás.<\u002Fdiv><div><span style=\"color:#F2F2F2\">Salida, atrás:<\u002Fspan> 14 ranuras de 3 × 30 en x 50–131, a la altura de los HAT (zb 44–74), sobre los conectores de la Pi.<\u002Fdiv><div><span style=\"color:#F2F2F2\">Tabiques de 2 mm:<\u002Fspan> uno en x 136–138 desde y 211 hasta la pared trasera, y otro en y 211 desde la pared izquierda hasta x 136, ambos de piso a zb 62. Cierran la bahía contra PCB-M y contra el frente; los cables pasan por dos muescas con pasamuros.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">4<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Panel trasero y frontal · 1:1<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Trasero visto desde atrás: la izquierda del dibujo es el lado derecho del equipo. x del CSV, zb desde la base del cuerpo<\u002Fspan><\u002Fdiv>\n<div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Panel trasero con la posición de cada conector\" width=\"{{ rearW }}\" height=\"{{ rearH }}\" sc-camel-view-box=\"{{ rearVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ rearS }}\" as=\"s\" hint-placeholder-count=\"50\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ rearT }}\" as=\"t\" hint-placeholder-count=\"50\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv>\n<div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Panel frontal con el jack de audífonos\" width=\"{{ frontW }}\" height=\"{{ frontH }}\" sc-camel-view-box=\"{{ frontVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ frontS }}\" as=\"s\" hint-placeholder-count=\"10\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ frontT }}\" as=\"t\" hint-placeholder-count=\"10\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv>\n<div style=\"display:flex;gap:48px;align-items:flex-start\"><div style=\"width:800px;flex:none\"><div style=\"display:grid;grid-template-columns:130px 70px 60px 250px minmax(0,1fr);font-size:12.5px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">CONECTOR<\u002Fdiv><div style=\"padding:8px 0\">X<\u002Fdiv><div style=\"padding:8px 0\">ZB<\u002Fdiv><div style=\"padding:8px 0\">TIPO<\u002Fdiv><div style=\"padding:8px 0\">VIENE DE<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ connList }}\" as=\"c\" hint-placeholder-count=\"16\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#9FE1CB\">{{ c.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ c.x }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ c.z }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ c.s }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ c.bd }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><div style=\"flex:1;display:flex;flex-direction:column;gap:12px;font-size:13px;line-height:20px;color:#B8B8B8\"><div>Punteado: envolvente del macho enchufado (1/4\" Ø 18, 3.5 mm Ø 12, RJ45 18 × 16, USB-A 18 × 11, USB-C 14 × 9). Mínimo entre envolventes: {{ connMin }} mm, en {{ connPair }}.<\u002Fdiv><div>Los jacks de 1/4\" van a paso 24, no a 26 como en la v4: con 340 de ancho y la bahía a la izquierda, PCB-M tiene 186 mm de borde. Con plugs de más de Ø 18 dos vecinos se rozan.<\u002Fdiv><div>Visto desde atrás: a la izquierda los 9 jacks de PCB-M y, encima, la tapa ciega del e-drum; a la derecha, lo que viene de la Pi (USB-C, USB-A, Ethernet, sala L/R) y sobre ellos las ranuras de salida.<\u002Fdiv><div>Frente: jack de audífonos en x 282, bajo la perilla CUE, a zb 40. Pasa 21 mm por debajo del pot.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">5<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Vista explotada<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:48px;align-items:flex-start\"><div style=\"width:700px;flex:none;display:flex;flex-direction:column;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#F2F2F2\"><sc-for list=\"{{ layers }}\" as=\"l\" hint-placeholder-count=\"13\"><div style=\"display:flex;align-items:center;gap:12px\"><div style=\"width:24px;text-align:right;color:#8A8A8A\">{{ l.i }}<\u002Fdiv><div style=\"width:{{ l.span }}px;flex:none;position:relative;height:{{ l.h }}px\"><div style=\"position:absolute;left:{{ l.ml }}px;top:0;width:{{ l.w }}px;height:{{ l.h }}px;background:{{ l.c }};border:1px solid {{ l.b }};box-sizing:border-box\"><\u002Fdiv><\u002Fdiv><div style=\"color:#F2F2F2;white-space:nowrap\">{{ l.n }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><div style=\"flex:1\"><div style=\"display:grid;grid-template-columns:28px 190px minmax(0,1fr);font-size:12.5px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">#<\u002Fdiv><div style=\"padding:8px 0\">PIEZA<\u002Fdiv><div style=\"padding:8px 0\">MATERIAL · PROCESO · FIJACIÓN<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ bom }}\" as=\"b\" hint-placeholder-count=\"13\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#8A8A8A\">{{ b.i }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#F2F2F2\">{{ b.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ b.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">5.1<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Plan de impresión<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">La forma exterior es la misma en los tres casos. Plantas a escala 0.38<\u002Fspan><\u002Fdiv>\n<div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Plan de impresión: una pieza, corte mínimo en dos y respaldo para la Ender\" width=\"{{ printW }}\" height=\"{{ printH }}\" sc-camel-view-box=\"{{ printVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ printS }}\" as=\"s\" hint-placeholder-count=\"14\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ printT }}\" as=\"t\" hint-placeholder-count=\"14\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);font-size:13px;line-height:20px;color:#C8C8C8\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A;padding:8px 12px 8px 0\"><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A;padding:8px 12px 8px 0\">UNA PIEZA · CAMA 350<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A;padding:8px 12px 8px 0\">CORTE MÍNIMO · 2 PIEZAS<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A;padding:8px 12px 8px 0\">RESPALDO · ENDER 3 V3<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Piezas<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">1 cuerpo de 340 × 340 × 83 + tapa de la bahía 94 × 68 × 3<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">138 × 340 × 83 y 202 × 340 × 83 + tapa<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">4 bandejas: 138 × 170 y 202 × 170, × 2 filas, × 83 de alto + tapa<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Cuándo<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Si el servicio imprime 340 × 340 reales sin borde de adherencia<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Si pide más de 5 mm de margen por lado, o no garantiza la planitud<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Si no hay servicio, o para probar antes de pagar<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Dónde se parte<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">No se parte<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">x 138: el tabique de la bahía pasa a ser la brida<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">x 138 (tabique) e y 170. Ningún corte pasa bajo PCB-M ni bajo la Pi<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Unión<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">—<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Brida interna de 12 mm, lengüeta 2 × 3, 5 insertos M3. Arriba la tapa la chapa; por fuera, una línea de 0.3 en frente y fondo<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Igual: lengüeta 2 × 3 y 3 insertos M3 por costura. Una línea por cara, a media pared<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Pared · piso<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">3.2 (4 perímetros con boquilla de 0.8) · 3 con nervios de 2 × 6 cada 50<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Igual<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">3 (4 perímetros con 0.4) · 3<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Orientación<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Piso sobre la cama, boca arriba<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Igual; la cara de la brida vertical<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Igual<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Soportes<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Ninguno. Ranuras verticales; agujeros de jack hasta Ø 9.5 sin soporte; el corte del DB15 (40 de puente) y el rebaje de los Sharp con puente<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Ninguno<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Ninguno<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Insertos M3<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Latón a calor, agujero Ø 4.0 × 6: 4 de la tapa + 6 de PCB-M. La chapa no usa insertos: PEM + tornillo desde abajo<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">+ 5 de brida<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">+ 12 de costuras<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Tolerancias<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Chapa a ras de la pared exterior: pedir 340.0 +0 / −0.6. Torres de los pozos a 73.0 ± 0.2 de alto. Agujeros de jack +0.4<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Igual; la brida se ajusta lijando<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">±0.2 por pieza; se suman 2 piezas contra los 340 de la chapa<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Material<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">PETG negro mate. ASA solo con cámara cerrada: 340 mm de lado alabean<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">PETG o ASA<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">PETG<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#9FE1CB;font-family:'IBM Plex Mono',monospace;font-size:12px\">Riesgo<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Alabeo de las esquinas sin borde de adherencia. Si falla, se pierde la pieza entera<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">Una costura visible como línea fina en frente y fondo<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">4 líneas visibles; más ajuste<\u002Fdiv><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;font-size:13px;line-height:20px;color:#B8B8B8\"><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">QUÉ PREGUNTARLE AL SERVICIO<\u002Fdiv><div>1. Área imprimible real de su cama de 350, y si imprimen 340 × 340 sin borde de adherencia.<\u002Fdiv><div>2. Tolerancia y planitud que garantizan en 340 mm.<\u002Fdiv><div>3. Boquilla y altura de capa; si tienen cámara cerrada para ASA.<\u002Fdiv><div>4. Acabado de las paredes y de la cara de la cama, que es el piso.<\u002Fdiv><div>5. Qué pasa si una esquina sale levantada.<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">DETALLES DEL CUERPO<\u002Fdiv><div>Esquinas verticales R5, iguales a las de la chapa. Canto inferior con chaflán de 2 × 45°, que se imprime sin soportes; el superior lo da el aluminio. Nada más.<\u002Fdiv><div>4 patas de goma Ø16 × 5 en rebajes de 1 mm, a 20 mm de cada esquina.<\u002Fdiv><div>Rebaje de 1.5 × 50 × 16 en la cara interior de cada pared lateral para las orejas de los Sharp (sección 8).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">6<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Contornos de placas en coordenadas del panel<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Escala 0.9 · puntos blancos: agujeros de montaje y pozos del cuerpo · <a href=\"pcb-outlines-console-v5.csv\">descargar el CSV de contornos, agujeros y huellas<\u002Fa><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:40px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Contornos de PCB-K, PCB-F, PCB-P y PCB-M sobre el panel\" width=\"{{ pcbW }}\" height=\"{{ pcbH }}\" sc-camel-view-box=\"{{ pcbVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ pcbS }}\" as=\"s\" hint-placeholder-count=\"100\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ pcbT }}\" as=\"t\" hint-placeholder-count=\"100\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;font-size:13px;line-height:20px;color:#B8B8B8\"><div style=\"display:grid;grid-template-columns:80px minmax(0,1.2fr) 100px 90px minmax(0,1fr);font-size:12.5px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">PLACA<\u002Fdiv><div style=\"padding:8px 0\">CONTORNO<\u002Fdiv><div style=\"padding:8px 0\">TAMAÑO<\u002Fdiv><div style=\"padding:8px 0\">PROF.<\u002Fdiv><div style=\"padding:8px 0\">MONTAJE<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ boardsV }}\" as=\"b\" hint-placeholder-count=\"5\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#9FE1CB\">{{ b.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#F2F2F2\">{{ b.o }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;\">{{ b.sz }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;\">{{ b.d }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ b.m }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">PCB-K · VÉRTICES (x, y) EN ORDEN<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2\">{{ kVerts }}<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">AGUJEROS (x, y)<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;line-height:20px;color:#F2F2F2;display:grid;grid-template-columns:80px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">PCB-K<\u002Fspan><span>{{ kHoles }} · Ø 3.2<\u002Fspan><span style=\"color:#9FE1CB\">PCB-F<\u002Fspan><span>{{ fHoles }} · Ø 3.2<\u002Fspan><span style=\"color:#9FE1CB\">PCB-P<\u002Fspan><span>{{ pHoles }} · Ø 2.7<\u002Fspan><span style=\"color:#9FE1CB\">PCB-M<\u002Fspan><span>{{ mHoles }} · Ø 3.2<\u002Fspan><span style=\"color:#9FE1CB\">Pozos<\u002Fspan><span>{{ wells }} · torre Ø 10<\u002Fspan><\u002Fdiv><div><span style=\"color:#F2F2F2\">PCB-K.<\u002Fspan> Lleva las 26 Choc, sus LED y los MCP. Ventanas: una de 122 × 62 para los pads de la M4 y 4 redondas de Ø 20 bajo los FSR de velocity, por donde pasan el disco y el tetón. Los 2 FSR de expresión, los faders, los encoders, el jog y los pots quedan fuera del contorno. Cuelga de la chapa con espárragos PEM M2.5 y separadores de 1.4.<\u002Fdiv><div><span style=\"color:#F2F2F2\">PCB-P.<\u002Fspan> Una tira de 223 × 31 con los 6 FSR. Va 1.5 mm por debajo de PCB-K donde se solapan, colgada de la chapa por 10 separadores entre tapas; 6 de ellos atraviesan PCB-K.<\u002Fdiv><div><span style=\"color:#F2F2F2\">PCB-A<\u002Fspan> no cambia: 200 × 30 en x 70–270, y 175–205.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#8A8A8A\">LAS 26 TECLAS QUE LEE PCB-K (DEL CSV, SIN CAMBIOS)<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:160px 180px 80px 80px 150px minmax(0,1fr);font-size:12.5px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">REF<\u002Fdiv><div style=\"padding:8px 0\">GRUPO<\u002Fdiv><div style=\"padding:8px 0\">X<\u002Fdiv><div style=\"padding:8px 0\">Y<\u002Fdiv><div style=\"padding:8px 0\">KEYCAP<\u002Fdiv><div style=\"padding:8px 0\">LED<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ keyRows }}\" as=\"k\" hint-placeholder-count=\"26\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#9FE1CB\">{{ k.ref }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ k.g }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ k.x }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ k.y }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;\">{{ k.cap }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:{{ k.c }}\">{{ k.zone }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">7<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Familia de keycaps, perillas y tapas<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Como en la v3, con el keycap nuevo · cortes a 3:1 · izquierda: la pieza montada; derecha: molde de dos partes (A abajo, B arriba)<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:18px;font-weight:600;color:#F2F2F2\">Perilla Ø18 · encoders (8) y MASTER / CUE VOL / IN (3)<\u002Fdiv><div style=\"display:flex;gap:32px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte de la perilla de 18 mm y de su molde\" width=\"{{ knobDW }}\" height=\"{{ knobDH }}\" sc-camel-view-box=\"{{ knobDVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ knobDS }}\" as=\"s\" hint-placeholder-count=\"16\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ knobDT }}\" as=\"t\" hint-placeholder-count=\"16\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:320px\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:20px;color:#C8C8C8;display:grid;grid-template-columns:100px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Geometría<\u002Fspan><span>Ø18 en la base, Ø17.2 arriba, 15 de alto, 1 mm sobre la chapa. Núcleo rígido Ø12 con agujero en D. Indicador: una aleta del núcleo que asoma por la funda, a lo largo de la cara superior y bajando por el costado: se ve desde arriba y desde el frente, y traba la funda contra el giro.<\u002Fspan><span style=\"color:#9FE1CB\">Impresa<\u002Fspan><span>Una pieza en PETG o resina. Agujero D Ø6.15 con plano a 4.60 en FDM (Ø6.08 / 4.55 en resina), 10 de fondo, ranura de alivio de 0.6 para que apriete. Eje vertical, cara superior sobre la cama, sin soportes. Indicador en bajorrelieve de 0.6 relleno con pintura o en segundo color.<\u002Fspan><span style=\"color:#9FE1CB\">Molde<\u002Fspan><span>Sobremoldeo: el núcleo impreso es el inserto. A = cavidad con la forma exterior y 24 estrías axiales, desmoldeo 2.5°. B = tapa con pin en D que centra el núcleo. Partición en el borde inferior de la falda. Colada Ø2 y venteo en la falda; la cara superior queda abajo y sale sin burbujas.<\u002Fspan><span style=\"color:#9FE1CB\">Material<\u002Fspan><span>Núcleo rígido (PETG o resina dura). Funda en silicona 60A, pared de 3.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:18px;font-weight:600;color:#F2F2F2\">Perilla del jog · 1<\u002Fdiv><div style=\"display:flex;gap:32px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte de la perilla del jog y del molde de su aro\" width=\"{{ jogDW }}\" height=\"{{ jogDH }}\" sc-camel-view-box=\"{{ jogDVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ jogDS }}\" as=\"s\" hint-placeholder-count=\"16\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ jogDT }}\" as=\"t\" hint-placeholder-count=\"16\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:320px\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:20px;color:#C8C8C8;display:grid;grid-template-columns:100px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Geometría<\u002Fspan><span>Ø40 × 14, 1.5 mm sobre la chapa para el clic. Disco rígido Ø34 con cubo en D, hoyuelo esférico Ø12 × 1.4 a 11.5 mm del centro y aro estriado de 3 mm con 40 estrías.<\u002Fspan><span style=\"color:#9FE1CB\">Impresa<\u002Fspan><span>Núcleo con la cara superior hacia arriba, capa de 0.12 en el hoyuelo. Bolsillo anular para dos arandelas M8 anchas (Ø24, ~19 g): pausa en la capa de cierre para meterlas, o se pegan desde abajo. Mismo agujero D que la perilla de 18.<\u002Fspan><span style=\"color:#9FE1CB\">Molde<\u002Fspan><span>Solo el aro. A = base con la cavidad anular y las estrías, desmoldeo 2°. B = tapa. El núcleo impreso va dentro como inserto y el aro queda adherido por 8 ventanas del canto. Partición en la cara inferior del aro.<\u002Fspan><span style=\"color:#9FE1CB\">Material<\u002Fspan><span>Núcleo y cara superior rígidos. Aro en silicona 50A. Inserto de acero opcional para inercia.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:18px;font-weight:600;color:#F2F2F2\">Keycap Choc V2 · 26, un solo molde<\u002Fdiv><div style=\"display:flex;gap:32px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte del keycap en sus dos alturas y de su molde\" width=\"{{ keyDW }}\" height=\"{{ keyDH }}\" sc-camel-view-box=\"{{ keyDVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ keyDS }}\" as=\"s\" hint-placeholder-count=\"16\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ keyDT }}\" as=\"t\" hint-placeholder-count=\"16\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:320px\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:20px;color:#C8C8C8;display:grid;grid-template-columns:100px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Geometría<\u002Fspan><span>13.5 × 13.5, R1.5, cara con cuna de R40. Normal: 6.6 de alto, piel de 1.2 sobre una máscara de 0.8. Transporte (5): 5.6 de alto, piel de 0.6 sobre máscara de 0.4. Es más chico que el corte de 14 × 14, así que baja dentro del rebaje sin rozar.<\u002Fspan><span style=\"color:#9FE1CB\">Impresa<\u002Fspan><span>Vástago en cruz tipo MX (verificar con la tecla). Cruz 4.10 × 1.30 en FDM, 4.05 × 1.25 en resina, 3.6 de fondo. Núcleo en resina negra: casquillo Ø5.6 y máscara con la ventana de 2.65 × 9 sobre el LED y la leyenda calada. En 13.5 mm entran 5 caracteres de 1.6: DUPLICATE, QUANTIZE y las escenas van con icono o abreviadas.<\u002Fspan><span style=\"color:#9FE1CB\">Molde<\u002Fspan><span>A = cavidad con la cara superior abajo, desmoldeo 3°. B = macho con cruz falsa que sostiene el núcleo. Partición en el borde inferior de la falda. Para el transporte: inserto de 1 mm en el fondo de A y núcleo «T». Molde de familia de 8 cavidades (2 × 4, 88 × 48): 3 coladas normales y 1 con insertos dan 24 + 8.<\u002Fspan><span style=\"color:#9FE1CB\">Material<\u002Fspan><span>Núcleo rígido negro. Piel en silicona translúcida 70A con 2 % de pigmento blanco.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:14px\"><div style=\"font-size:18px;font-weight:600;color:#F2F2F2\">Tapa / actuador de FSR · 6<\u002Fdiv><div style=\"display:flex;gap:32px;align-items:flex-start\"><div style=\"background:#0C0C0C;border:1px solid #262626;padding:20px;flex:none;align-self:flex-start\"><svg role=\"img\" aria-label=\"Corte de la tapa de FSR sobre el sensor y de su molde\" width=\"{{ fsrDW }}\" height=\"{{ fsrDH }}\" sc-camel-view-box=\"{{ fsrDVB }}\" style=\"display:block;font-family:'IBM Plex Mono',monospace\"><sc-for list=\"{{ fsrDS }}\" as=\"s\" hint-placeholder-count=\"16\"><path d=\"{{ s.d }}\" fill=\"{{ s.f }}\" stroke=\"{{ s.s }}\" style=\"stroke-width:{{ s.w }}px;stroke-dasharray:{{ s.da }}\"><\u002Fpath><\u002Fsc-for><sc-for list=\"{{ fsrDT }}\" as=\"t\" hint-placeholder-count=\"16\"><text x=\"{{ t.x }}\" y=\"{{ t.y }}\" fill=\"{{ t.c }}\" text-anchor=\"{{ t.a }}\" style=\"font-size:{{ t.fs }}px;font-weight:{{ t.fw }}\">{{ t.t }}<\u002Ftext><\u002Fsc-for><\u002Fsvg><\u002Fdiv><div style=\"flex:1;min-width:320px\"><div style=\"font-family:'IBM Plex Sans',sans-serif;font-size:13px;line-height:20px;color:#C8C8C8;display:grid;grid-template-columns:100px minmax(0,1fr);gap:0 8px\"><span style=\"color:#9FE1CB\">Geometría<\u002Fspan><span>Tapa 25 × 25, 4 mm sobre la chapa, con ala de 31 × 31 × 1.3 que la retiene por debajo. Disco rígido Ø16 embebido y, bajo él, un tetón Ø10.5 × 1.2 que es lo único que toca el sensor. PCB-P a −6.5. Velocity con cara plana; expresión con cuna de R30 y 1.5 de fondo: un inserto en el fondo de la cavidad, mismo molde.<\u002Fspan><span style=\"color:#9FE1CB\">Impresa<\u002Fspan><span>Para prototipo: tapa en TPU 85A con el disco de PETG pegado. Disco Ø16 × 1.5 plano sobre la cama. La holgura al corte es 0.3 por lado.<\u002Fspan><span style=\"color:#9FE1CB\">Molde<\u002Fspan><span>A = cavidad con la cara superior abajo, desmoldeo 2°. B = tapa que forma el ala y el tetón, con 3 pines que sostienen el disco. Partición en el plano superior del ala, oculto bajo la chapa. Colada por el ala, venteo en las 4 esquinas.<\u002Fspan><span style=\"color:#9FE1CB\">Material<\u002Fspan><span>Silicona 40A. Disco rígido en PETG o FR4.<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"background:#161616;border:1px solid #262626;padding:20px 24px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:22px;color:#C8C8C8;max-width:1500px\"><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1.5px;color:#5DCAA5\">LED POR ZONA: QUE VERDE Y VIOLETA SE LEAN DE DÍA<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">El problema es el violeta.<\u002Fspan> A la misma corriente, el verde de un SK6812 se ve varias veces más brillante que rojo + azul. Si los dos pasan por la misma ventana, de día el verde se lee y el violeta se pierde.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Que brille la ventana, no el keycap.<\u002Fspan> El núcleo negro tapa todo salvo una barra de 2.65 × 9 mm sobre el LED y la leyenda calada. Un keycap entero translúcido se lava con el sol; una barra brillante sobre negro mantiene el contraste.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Pozo de luz blanco.<\u002Fspan> El interior del casquillo y la cara inferior de la máscara van pintados de blanco, para que la luz que no sale a la primera rebote en vez de absorberse.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Piel con 2 % de pigmento blanco y 1.2 de espesor.<\u002Fspan> Difunde lo justo para no ver el punto del LED. La piel de 0.6 del transporte difunde menos: ahí la máscara lleva la ventana a 1.5 mm del eje del LED, no encima.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Compensar en firmware, no en el molde.<\u002Fspan> Un solo molde significa una sola ventana. Violeta como (R 150, G 40, B 255) en vez de rojo + azul puros: el poco de verde sube la luminancia sin que deje de leerse violeta. Verde al 40 % de ese nivel. Partir de ahí y ajustar a la vista, de día, con el keycap real: no tengo medidas de luminancia de este LED bajo esta silicona.<\u002Fdiv><div><span style=\"color:#F2F2F2;font-weight:600\">Presupuesto.<\u002Fspan> El doc 24 limita las 26 teclas a 0.6 A (brillo ≤ 25 %). El violeta propuesto pide cerca de 2.5 veces la corriente del verde por tecla: hay que medirlo contra ese tope.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">8<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Choques contra el CSV<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Valor medido y ajuste propuesto. Ningún ajuste está aplicado a las coordenadas<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:300px 210px 130px minmax(0,1fr) minmax(0,1fr);font-size:13px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">ELEMENTO<\u002Fdiv><div style=\"padding:8px 0\">MEDIDO<\u002Fdiv><div style=\"padding:8px 0\">ESTADO<\u002Fdiv><div style=\"padding:8px 0\">QUÉ PASA<\u002Fdiv><div style=\"padding:8px 0\">AJUSTE PROPUESTO<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ clashV }}\" as=\"c\" hint-placeholder-count=\"12\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#F2F2F2\">{{ c.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#F2F2F2\">{{ c.v }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;font-weight:600;color:{{ c.c }}\">{{ c.s }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ c.m }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ c.fix }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">9<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Renders · producto terminado<\u002Fspan><span style=\"font-size:14px;color:#8A8A8A\">Modelo 3D de la misma geometría: arrastrar para girar · descarga OBJ / GLB · <a href=\"GrooveForge Console 3D v5.html\">abrir a pantalla completa<\u002Fa><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px\"><div style=\"display:flex;flex-direction:column;gap:8px\"><iframe title=\"Render 3/4 de frente\" src=\"about:blank#8330921f-356c-4ea3-8891-e617f98730e5\" style=\"width:100%;height:640px;border:1px solid #262626;background:#d9d6cf;display:block\"><\u002Fiframe><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A8A8A\">3/4 DE FRENTE<\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><iframe title=\"Render trasero\" src=\"about:blank#8330921f-356c-4ea3-8891-e617f98730e5\" style=\"width:100%;height:640px;border:1px solid #262626;background:#d9d6cf;display:block\"><\u002Fiframe><div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8A8A8A\">TRASERA<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;flex-direction:column;gap:24px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;border-bottom:1px solid #262626;padding-bottom:12px\"><span style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;color:#5DCAA5\">10<\u002Fspan><span style=\"font-size:28px;font-weight:600;color:#F2F2F2\">Medidas a verificar con calibre<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:28px 400px 260px minmax(0,1fr);font-size:13px;line-height:20px;color:#C8C8C8\"><div style=\"display:contents;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:#8A8A8A\"><div style=\"padding:8px 0\">#<\u002Fdiv><div style=\"padding:8px 0\">MEDIDA<\u002Fdiv><div style=\"padding:8px 0\">ASUMIDO<\u002Fdiv><div style=\"padding:8px 0\">QUÉ CAMBIA SI DIFIERE<\u002Fdiv><\u002Fdiv><sc-for list=\"{{ verify }}\" as=\"v\" hint-placeholder-count=\"19\"><div style=\"display:contents\"><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#8A8A8A\">{{ v.i }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;color:#F2F2F2\">{{ v.n }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;font-family:'IBM Plex Mono',monospace;color:#E8B84A\">{{ v.a }}<\u002Fdiv><div style=\"border-top:1px solid #262626;padding:8px 12px 8px 0;\">{{ v.d }}<\u002Fdiv><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { M: null };\n  componentDidMount() { import('./grooveforge-console-geometry-v5.js').then(M => this.setState({ M })); }\n  renderVals() {\n    const E = { S: [], T: [], VB: '0 0 10 10', W: '10mm', H: '10mm' }, base = {};\n    ['top', 'secA', 'secB', 'rear', 'front', 'pcb', 'print', 'knobD', 'jogD', 'keyD', 'fsrD'].forEach(k => Object.keys(E).forEach(p => { base[k + p] = E[p]; }));\n    const M = this.state.M;\n    if (!M) return base;\n    const G = M.build(), f = G.f1, W = G.W, d = M.drawings(G), v = { ...base };\n    Object.keys(d).forEach(k => Object.keys(d[k]).forEach(p => { v[k + p] = d[k][p]; }));\n    const T = { teal: '#5DCAA5', amber: '#E8B84A', red: '#E8705A', white: '#F2F2F2', violet: '#A99BFF' };\n    const ctl = [...G.keys, ...G.encs, G.jog, ...G.pads, ...G.fsr, ...G.faders, ...G.pots, G.sel, ...G.sharps];\n    const rows = M.ROWS.filter(r => !['outline', 'jack'].includes(r.kind)), nMoved = rows.filter(r => !ctl.some(c => c.x === r.x && c.y === r.y)).length;\n    const cc = { CHOQUE: T.red, JUSTO: T.amber, AVISO: T.amber, 'A CONFIRMAR': T.amber, OK: T.teal };\n    const clashV = G.clashes.map(c => ({ ...c, c:
