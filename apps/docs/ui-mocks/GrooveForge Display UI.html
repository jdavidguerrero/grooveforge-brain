<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrooveForge Brain — Display UI v1.0</title>
  <link rel="stylesheet" href="blueprint-styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: #0e1117;
      overflow: hidden;
      width: 100vw; height: 100vh;
    }
    #root { width: 100%; height: 100%; }

    /* Subtle animated breathing for AI/audio indicators */
    @keyframes breathe {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.92); }
    }
    .breathe { animation: breathe 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    .pulse-glow { animation: pulse-glow 1.8s ease-in-out infinite; }

    @keyframes rotate-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .rotate-slow { animation: rotate-slow 6s linear infinite; transform-origin: 120px 120px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="display-views.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PAGE_W = 1920;
    const PAGE_H = 1550;

    function Spec() {
      const [scale, setScale] = useState(1);

      useEffect(() => {
        function fit() {
          const cw = window.innerWidth;
          const ch = window.innerHeight;
          setScale(Math.min(cw / PAGE_W, ch / PAGE_H));
        }
        fit();
        window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);

      return (
        <div style={{
          width: '100vw', height: '100vh',
          background: '#0e1117', overflow: 'hidden',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
        }}>
          <div style={{
            width: PAGE_W, height: PAGE_H,
            transform: `scale(${scale})`, transformOrigin: 'center center',
            position: 'relative',
          }}>
            {/* Grid bg */}
            <div style={{
              position: 'absolute', inset: 0,
              backgroundImage: `
                linear-gradient(#1a1f2a 1px, transparent 1px),
                linear-gradient(90deg, #1a1f2a 1px, transparent 1px),
                linear-gradient(#242a38 1px, transparent 1px),
                linear-gradient(90deg, #242a38 1px, transparent 1px)
              `,
              backgroundSize: '20px 20px, 20px 20px, 100px 100px, 100px 100px',
              opacity: 0.4, pointerEvents: 'none',
            }} />
            {/* Border frames */}
            <div style={{ position: 'absolute', inset: 15, border: '1px solid #2a3040', pointerEvents: 'none' }} />
            <div style={{ position: 'absolute', inset: 18, border: '0.5px solid #1e2535', pointerEvents: 'none' }} />

            <Header />
            <Legend />
            <ViewGrid />
            <TitleBlock />
          </div>
        </div>
      );
    }

    function Header() {
      return (
        <div style={{
          position: 'absolute', top: 28, left: 36, right: 36,
          display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start',
        }}>
          <div>
            <div style={{
              fontFamily: "'Space Grotesk', sans-serif",
              fontSize: 28, fontWeight: 700, letterSpacing: 6,
              color: '#1D9E75', textTransform: 'uppercase',
            }}>GrooveForge Brain</div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 11, color: '#6A7080', letterSpacing: 2, marginTop: 4,
            }}>DISPLAY UI v1.0 — GC9A01 1.28" CIRCULAR TFT — 240 × 240 px — LVGL / ESP32-S3</div>
          </div>
          <div style={{ textAlign: 'right' }}>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 10, color: '#E8A030', letterSpacing: 1,
            }}>REV A — 10 VIEWS</div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 9, color: '#5a6070', letterSpacing: 1, marginTop: 3,
            }}>SAFE ZONE: 220 px Ø ( 10 px MARGIN )</div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 9, color: '#5a6070', letterSpacing: 1, marginTop: 2,
            }}>RENDER: NATIVE 1:1 SCALE</div>
          </div>
        </div>
      );
    }

    function Legend() {
      return (
        <div style={{
          position: 'absolute', top: 88, left: 36, right: 36, height: 130,
          background: '#11141b', border: '1px solid #2a3040',
          padding: '12px 22px', display: 'flex', gap: 30,
          alignItems: 'center',
        }}>
          {/* Input mapping */}
          <div style={{ flex: 1, display: 'flex', gap: 22, alignItems: 'center' }}>
            <SectionLabel>INPUT MAPPING</SectionLabel>
            <InputControl name="ENC L" synth="CUTOFF" fx="DRY/WET" push="MENU" />
            <InputControl name="ENC NAV" synth="PAGE ▲▼" fx="FX SELECT" push="PUSH ENTER" doublePush />
            <InputControl name="ENC R" synth="RESONANCE" fx="DEPTH" push="—" />
            <Buttons />
          </div>

          {/* Color palette */}
          <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
            <SectionLabel>PALETTE</SectionLabel>
            <Swatch hex="#0A0A0A" name="BG" sub="ANTHRACITE" />
            <Swatch hex="#1D9E75" name="TEAL" sub="PRIMARY" />
            <Swatch hex="#5DCAA5" name="TEAL+" sub="ACTIVE" />
            <Swatch hex="#534AB7" name="PURPLE" sub="FX MODE" />
            <Swatch hex="#9FE1CB" name="GRAY" sub="LABELS" />
            <Swatch hex="#E84A4A" name="RED" sub="ERROR" />
            <Swatch hex="#FFFFFF" name="WHITE" sub="HERO TEXT" />
          </div>

          {/* Safe zone diagram */}
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4 }}>
            <SectionLabel>SAFE ZONE</SectionLabel>
            <svg width={70} height={70} viewBox="0 0 70 70">
              <rect x={1} y={1} width={68} height={68} fill="none"
                stroke="#3a4255" strokeWidth={0.5} strokeDasharray="2 2" />
              <circle cx={35} cy={35} r={32} fill="#0A0A0A" stroke="#1D9E75" strokeWidth={0.8} />
              <circle cx={35} cy={35} r={29} fill="none" stroke="#5DCAA5"
                strokeWidth={0.4} strokeDasharray="1 2" opacity={0.6} />
              <text x={35} y={37} textAnchor="middle"
                fontFamily="'IBM Plex Mono', monospace" fontSize={5}
                fill="#9FE1CB" letterSpacing={0.5}>240×240</text>
            </svg>
          </div>
        </div>
      );
    }

    function SectionLabel({ children }) {
      return (
        <div style={{
          fontFamily: "'Space Grotesk', sans-serif",
          fontSize: 9, color: '#1D9E75', letterSpacing: 2.5,
          fontWeight: 600, textTransform: 'uppercase',
          writingMode: 'horizontal-tb',
        }}>{children}</div>
      );
    }

    function InputControl({ name, synth, fx, push, doublePush }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, minWidth: 100 }}>
          <svg width={42} height={42} viewBox="0 0 42 42">
            <circle cx={21} cy={21} r={18} fill="#1A1C1F" stroke="#1D9E75" strokeWidth={0.7} />
            <circle cx={21} cy={21} r={14} fill="#0A0A0A" stroke="#3a4255" strokeWidth={0.4} />
            {Array.from({ length: 18 }).map((_, i) => {
              const a = (i / 18) * Math.PI * 2;
              return (
                <line key={`tk-${i}`}
                  x1={21 + Math.cos(a) * 15} y1={21 + Math.sin(a) * 15}
                  x2={21 + Math.cos(a) * 18} y2={21 + Math.sin(a) * 18}
                  stroke="#3a4255" strokeWidth={0.4} />
              );
            })}
            <line x1={21} y1={6} x2={21} y2={10} stroke="#5DCAA5" strokeWidth={1.2} />
          </svg>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 8, color: '#5DCAA5', letterSpacing: 1.5, fontWeight: 600,
          }}>{name}</div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 7, color: '#9FE1CB', letterSpacing: 0.5, opacity: 0.8,
            display: 'flex', flexDirection: 'column', gap: 1,
          }}>
            <span><span style={{ color: '#6A7080' }}>S:</span> {synth}</span>
            <span><span style={{ color: '#6A7080' }}>F:</span> {fx}</span>
            <span><span style={{ color: '#6A7080' }}>P:</span> {push}</span>
            {doublePush && <span style={{ color: '#E8A030' }}>2× MODE SWITCH</span>}
          </div>
        </div>
      );
    }

    function Buttons() {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, alignItems: 'center' }}>
          <div style={{ display: 'flex', gap: 4 }}>
            {['B1', 'B2', 'B3', 'B4'].map((b, i) => (
              <div key={b} style={{
                width: 26, height: 26, borderRadius: 3,
                background: '#1A1C1F',
                border: '0.7px solid #1D9E75',
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 8, color: '#5DCAA5', fontWeight: 600,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                letterSpacing: 0.5,
              }}>{b}</div>
            ))}
          </div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 7, color: '#9FE1CB', letterSpacing: 0.5, opacity: 0.8,
            textAlign: 'center',
          }}>CONTEXT BUTTONS<br/><span style={{ color: '#6A7080' }}>per-mode legend on screen footer</span></div>
        </div>
      );
    }

    function Swatch({ hex, name, sub }) {
      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2 }}>
          <div style={{
            width: 24, height: 24, borderRadius: 3,
            background: hex, border: '0.5px solid #2a3040',
            boxShadow: hex !== '#0A0A0A' && hex !== '#FFFFFF' ? `0 0 8px ${hex}55` : 'none',
          }} />
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 7.5, color: '#C8CDD8', letterSpacing: 0.8, fontWeight: 500,
          }}>{name}</div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 6.5, color: '#5a6070', letterSpacing: 0.5,
          }}>{sub}</div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 6, color: '#6A7080', marginTop: 1,
          }}>{hex}</div>
        </div>
      );
    }

    /* ============ VIEW GRID ============ */

    function ViewGrid() {
      const tiles = [
        { num: '01', title: 'BOOT SEQUENCE', span: 2, view: 'boot', wide: true,
          lvgl: 'lv_label · lv_arc (ring fill)', anim: '1500ms total · ease-out',
          elements: [
            ['A', 'Wordmark', '#5DCAA5 · 32px · letter-spacing 4', 'fade-in + scale 0.85→1'],
            ['B', 'Subtitle "BRAIN"', '#1D9E75 · 18px · spacing 8', 'fade-in @ 500ms'],
            ['C', 'Loading ring', '#1D9E75 · 2px stroke · 220px Ø', 'arc fill 0→360° in 1000ms'],
            ['D', 'Version tag', '#9FE1CB · 8px · opacity 0.7', 'static'],
          ] },
        { num: '02', title: 'SYNTH · MAIN', view: 'synth',
          lvgl: 'lv_label · lv_arc (page dots) · lv_obj (pill)', anim: 'arc pulse @ note-on, 220ms',
          elements: [
            ['A', 'Engine arc title', '#1D9E75 · 11px · arc 30°→150°', 'static · pulse on audio'],
            ['B', 'Hero note', '#FFFFFF · 64px · IBM Plex Mono', 'snap-in 80ms on key'],
            ['C', 'Param readout', '#9FE1CB · 10px', 'live, debounced 30ms'],
            ['D', 'Velocity bar', '#1D9E75 · 1.4px line', 'live'],
            ['E', 'Page dots', '#1D9E75 · 5 dots · active=2.4r', 'static'],
            ['F', 'Mode pill', '#1D9E75 outline · 7px', 'static'],
          ] },
        { num: '03', title: 'OSC PAGE', view: 'osc',
          lvgl: 'lv_bar (×3) · lv_canvas (wave glyph)', anim: 'edit row glow @ NAV step',
          elements: [
            ['A', 'OSC row active', '#5DCAA5 · bg 8% teal', 'highlighted by ENC NAV'],
            ['B', 'Waveform glyph', '#5DCAA5 · 1.4px stroke', 'static'],
            ['C', 'Level bar', '#5DCAA5 · 80px max', 'live'],
            ['D', 'Detune ¢', '#FFFFFF · 8px mono', 'live'],
            ['E', 'Edit indicator ▶', '#5DCAA5 · triangle 6px', 'snaps on NAV turn'],
            ['F', 'Edge params L/R', '#FFFFFF · 9px', 'always visible'],
          ] },
        { num: '04', title: 'ENV · ADSR', view: 'env',
          lvgl: 'lv_chart · lv_line · lv_label', anim: 'curve redraws on value change · 60ms',
          elements: [
            ['A', 'Editing label', '#5DCAA5 · 7px · top center', 'updates on NAV'],
            ['B', 'Active segment', '#5DCAA5 · 2.2px stroke', 'highlighted'],
            ['C', 'Inactive segments', '#1D9E75 · opacity 0.45', 'dimmed'],
            ['D', 'Vertices', '#5DCAA5 · 1.8r dots', 'static'],
            ['E', 'Segment labels', 'inherits segment color', 'live · ms/level'],
          ] },
        { num: '05', title: 'LFO · MOD', view: 'lfo',
          lvgl: 'lv_chart (animated) · lv_label', anim: 'wave scrolls @ RATE Hz · 30fps',
          elements: [
            ['A', 'LFO wave', '#5DCAA5 · 2px stroke', 'animated @ rate'],
            ['B', 'Playhead', '#FFFFFF · 2.4r dot', 'follows wave'],
            ['C', 'RATE / DEPTH', '#FFFFFF · 11px mono', 'live'],
            ['D', 'TARGET / SHAPE', '#5DCAA5 · 9px caps', 'live'],
            ['E', 'Center axis', '#9FE1CB · dashed 0.4', 'static'],
          ] },
        { num: '06', title: 'ENGINE SELECT', view: 'engine',
          lvgl: 'lv_list · lv_btn · lv_obj scrollbar', anim: 'list scroll 120ms · ease-out',
          elements: [
            ['A', 'Active engine row', '#1D9E75 bg 22% · white text', 'live'],
            ['B', 'Engine code box', '#1D9E75 fill · 14×14', 'per-engine'],
            ['C', 'Available rows', '#9FE1CB · normal', 'tappable via NAV'],
            ['D', 'Coming-soon (v1.1)', 'opacity 0.32 · "v1.1" tag', 'grayed'],
            ['E', 'Scrollbar', '#1D9E75 · 2px', 'reflects position'],
            ['F', 'Footer hint', '#9FE1CB · 7px · opacity 0.6', 'static'],
          ] },
        { num: '07', title: 'FX · MAIN', view: 'fx',
          lvgl: 'lv_arc (×2) · lv_label · obj tint', anim: 'arc sweep on value · 80ms',
          elements: [
            ['A', 'Purple tint overlay', '#534AB7 · opacity 0.18', 'static · mode marker'],
            ['B', 'Layer arc title', '#7A6FE0 · 11px', 'updates on layer change'],
            ['C', 'FX name hero', '#FFFFFF · 22px · 2-line', 'static per FX'],
            ['D', 'WET arc (left)', '#7A6FE0 · 6px stroke · 140° span', 'live · ENC L'],
            ['E', 'DEPTH arc (right)', '#7A6FE0 · 6px stroke · 140° span', 'live · ENC R'],
            ['F', 'Layer dots', '#7A6FE0 · 3 dots', 'INS/SND/MST'],
          ] },
        { num: '08', title: 'FX SELECT (12)', view: 'fxselect',
          lvgl: 'lv_list scroll · lv_canvas (glyphs)', anim: 'center-snap · 140ms · ease',
          elements: [
            ['A', 'Active row scale', '#FFFFFF · 11px · 1.3× glyph', 'enlarged + bright'],
            ['B', 'Inactive rows', '#9FE1CB · 9px · op 0.35', 'dimmed'],
            ['C', 'Selection brackets', '#7A6FE0 · 1.2px corners', 'frame active'],
            ['D', 'FX glyph (line art)', '#7A6FE0 · ~14px · vector', 'per-FX'],
            ['E', 'Position N/12', '#7A6FE0 · 9px', 'live counter'],
          ] },
        { num: '09', title: 'MODE SWITCH', span: 2, view: 'modeswitch', wide: true,
          lvgl: 'lv_anim · lv_obj fade/scale · lv_obj_set_style_bg_color', anim: '400ms total · ease-in-out',
          elements: [
            ['A', 'Outgoing view fade', '#1D9E75 → 0 over 200ms', 'frame 0→1'],
            ['B', 'Radial wipe', 'radial grad #534AB7→#1D9E75', 'center-out · 200ms'],
            ['C', 'LED edge sweep', '#5DCAA5 · 114r ring · dashed', 'rotates 360° in 200ms'],
            ['D', 'Incoming view rise', '#534AB7 tint fades in · scale 0.9→1', 'frame 1→2'],
            ['E', 'Mode pill swap', 'SYNTH (teal) → FX (purple)', 'crossfade @ t=300ms'],
          ] },
        { num: '10', title: 'AI PROCESSING', view: 'ai',
          lvgl: 'lv_anim (timeline) · lv_label · lv_obj (×8 dots)', anim: '8-dot chase 800ms · core pulse 1.4s',
          elements: [
            ['A', 'Core pulse', '#5DCAA5 + glow · 6/10/14 r layers', 'breathe 1.4s ease-in-out'],
            ['B', 'Orbit dots (8)', '#5DCAA5 · 3.2r · 50r orbit', 'sequential chase'],
            ['C', '"AI THINKING"', '#5DCAA5 · 10px · spacing 2.5', 'static'],
            ['D', 'Status sub-line', '#9FE1CB · 7px · op 0.55', 'rotates analysis text'],
            ['E', 'Brand arc', '#1D9E75 · 11px', 'static · "GROOVEFORGE AI"'],
            ['F', 'On complete →', 'morphs to SUGGESTION READY (200ms)', 'after 2–5s'],
          ] },
      ];

      // Place tiles on a 6-column grid (so spans of 2 = 2/6 = 1/3 width)
      // Row 1: V1(span 2), V2, V3, V4 → 2+1+1+1 = 5 cols (oops). Let me use 5 cols.
      // Row 1: V1 (span 2) + V2 + V3 + V4 = 5
      // Row 2: V5 + V6 + V7 + V8 + V10 = 5
      // Row 3: V9 (span 2) + impl notes (span 3) = 5

      return (
        <div style={{
          position: 'absolute', top: 232, left: 28, right: 28, bottom: 70,
          display: 'grid',
          gridTemplateColumns: 'repeat(5, 1fr)',
          gridTemplateRows: '1fr 1fr 1fr',
          gap: 12,
        }}>
          <Tile {...tiles[0]} /> {/* V1 span 2 */}
          <Tile {...tiles[1]} />
          <Tile {...tiles[2]} />
          <Tile {...tiles[3]} />

          <Tile {...tiles[4]} />
          <Tile {...tiles[5]} />
          <Tile {...tiles[6]} />
          <Tile {...tiles[7]} />
          <Tile {...tiles[9]} /> {/* V10 (AI) */}

          <Tile {...tiles[8]} /> {/* V9 span 2 */}
          <ImplNotesTile />
        </div>
      );
    }

    /* ============ TILE ============ */

    function Tile({ num, title, view, span, wide, lvgl, anim, elements }) {
      const colSpan = span || 1;

      return (
        <div style={{
          gridColumn: `span ${colSpan}`,
          background: '#11141b',
          border: '1px solid #2a3040',
          padding: '10px 12px 8px',
          display: 'flex', flexDirection: 'column',
          position: 'relative',
          overflow: 'hidden',
        }}>
          {/* Tile header */}
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 6 }}>
            <div style={{
              fontFamily: "'Space Grotesk', sans-serif",
              fontSize: 11, fontWeight: 700, color: '#1D9E75',
              letterSpacing: 2,
              padding: '2px 6px',
              border: '0.7px solid #1D9E75',
              borderRadius: 2,
            }}>VIEW {num}</div>
            <div style={{
              fontFamily: "'Space Grotesk', sans-serif",
              fontSize: 13, fontWeight: 600, color: '#C8CDD8',
              letterSpacing: 1.5,
            }}>{title}</div>
            <div style={{ flex: 1 }} />
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 8, color: '#5a6070', letterSpacing: 1,
            }}>{wide ? '720 × 240 KEYFRAMES' : '240 × 240 px'}</div>
          </div>

          {/* Display rendering */}
          <div style={{
            display: 'flex', justifyContent: 'center', alignItems: 'center',
            padding: '6px 0', position: 'relative',
          }}>
            <DisplaySVG view={view} wide={wide} />
          </div>

          {/* Elements list */}
          <div style={{ marginTop: 4, flex: 1 }}>
            {elements.map((row, i) => (
              <div key={`el-${i}`} style={{
                display: 'grid',
                gridTemplateColumns: wide ? '14px 1.1fr 1.6fr 1.2fr' : '14px 1fr 1.4fr 1fr',
                fontFamily: "'IBM Plex Mono', monospace",
                fontSize: 7.5, lineHeight: '12px',
                color: '#9FE1CB', gap: 4,
                padding: '1px 0',
                borderBottom: i < elements.length - 1 ? '0.4px dashed #1e2535' : 'none',
              }}>
                <span style={{ color: '#E8A030', fontWeight: 600 }}>{row[0]}</span>
                <span style={{ color: '#C8CDD8' }}>{row[1]}</span>
                <span style={{ color: '#5a6070' }}>{row[2]}</span>
                <span style={{ color: '#5DCAA5', opacity: 0.7 }}>{row[3]}</span>
              </div>
            ))}
          </div>

          {/* Footer: LVGL + animation */}
          <div style={{
            marginTop: 6, paddingTop: 6,
            borderTop: '0.6px solid #2a3040',
            display: 'flex', flexDirection: 'column', gap: 2,
          }}>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 8, color: '#9FE1CB', letterSpacing: 0.8,
            }}>
              <span style={{ color: '#1D9E75', fontWeight: 600, marginRight: 6 }}>LVGL</span>
              {lvgl}
            </div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 8, color: '#9FE1CB', letterSpacing: 0.8,
            }}>
              <span style={{ color: '#E8A030', fontWeight: 600, marginRight: 6 }}>ANIM</span>
              {anim}
            </div>
          </div>
        </div>
      );
    }

    /* ============ DISPLAY SVG WRAPPER ============ */

    function DisplaySVG({ view, wide }) {
      const renderView = () => {
        switch (view) {
          case 'boot': return <ViewBoot />;
          case 'synth': return <ViewSynthMain />;
          case 'osc': return <ViewOSC />;
          case 'env': return <ViewENV />;
          case 'lfo': return <ViewLFO />;
          case 'engine': return <ViewEngineSelector />;
          case 'fx': return <ViewFXMain />;
          case 'fxselect': return <ViewFXSelector />;
          case 'modeswitch': return <ViewModeSwitch />;
          case 'ai': return <ViewAIProcessing />;
          default: return null;
        }
      };

      const W = wide ? 420 : 220;
      const H = wide ? 165 : 220;
      const VBW = wide ? 420 : 240;
      const VBH = wide ? 270 : 240;

      return (
        <svg width={W} height={H} viewBox={`0 0 ${VBW} ${VBH}`}>
          {/* Rim/bezel */}
          {wide ? (
            <g>
              {[0, 140, 280].map((tx, i) => (
                <g key={`rim-${i}`} transform={`translate(${tx}, 0) scale(0.5)`}>
                  <circle cx={120} cy={120} r={122} fill="none"
                    stroke="#2a3040" strokeWidth={1.5} />
                </g>
              ))}
            </g>
          ) : (
            <g>
              <circle cx={120} cy={120} r={122} fill="none"
                stroke="#2a3040" strokeWidth={1.5} />
              <circle cx={120} cy={120} r={125} fill="none"
                stroke="#1e2535" strokeWidth={0.5} />
            </g>
          )}
          {renderView()}
        </svg>
      );
    }

    /* ============ IMPL NOTES TILE ============ */

    function ImplNotesTile() {
      return (
        <div style={{
          gridColumn: 'span 3',
          background: '#11141b',
          border: '1px solid #2a3040',
          padding: '10px 14px',
          display: 'flex', flexDirection: 'column',
        }}>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, marginBottom: 8 }}>
            <div style={{
              fontFamily: "'Space Grotesk', sans-serif",
              fontSize: 11, fontWeight: 700, color: '#1D9E75',
              letterSpacing: 2, padding: '2px 6px',
              border: '0.7px solid #1D9E75', borderRadius: 2,
            }}>IMPL</div>
            <div style={{
              fontFamily: "'Space Grotesk', sans-serif",
              fontSize: 13, fontWeight: 600, color: '#C8CDD8', letterSpacing: 1.5,
            }}>FIRMWARE NOTES</div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 14, flex: 1 }}>
            <NoteBlock title="TYPOGRAPHY">
              <NoteRow label="HERO">IBM Plex Mono · 48–64 px · weight 300</NoteRow>
              <NoteRow label="PRIMARY">IBM Plex Mono · 16–22 px · weight 500</NoteRow>
              <NoteRow label="LABEL">IBM Plex Mono · 10–11 px · letter-spacing 2px</NoteRow>
              <NoteRow label="MICRO">IBM Plex Mono · 7–8 px · weight 400</NoteRow>
              <NoteRow label="GLYPH">vector line-art · stroke 1.2–1.4 px</NoteRow>
            </NoteBlock>

            <NoteBlock title="GLOBAL RULES">
              <NoteRow label="SAFE Ø">≤ 220 px · 10 px margin from rim</NoteRow>
              <NoteRow label="ARC TITLE">top 30°–150° · 90 r baseline</NoteRow>
              <NoteRow label="EDGE PARAMS">ENC L &amp; ENC R always visible (synth pages)</NoteRow>
              <NoteRow label="MODE PILL">always bottom · y=224 · 36×12 px</NoteRow>
              <NoteRow label="PAGE DOTS">y=198 · gap 12 · active 2.4 r · idle 1.6 r</NoteRow>
            </NoteBlock>

            <NoteBlock title="STATE TRANSITIONS">
              <NoteRow label="PAGE ↔">slide 120 ms · ease-out</NoteRow>
              <NoteRow label="MODE ↔">radial wipe 400 ms · ease-in-out</NoteRow>
              <NoteRow label="EDIT FOCUS">bg-glow 60 ms · snap on NAV detent</NoteRow>
              <NoteRow label="AUDIO ACTIVE">engine-arc pulse 220 ms @ note-on</NoteRow>
              <NoteRow label="AI ENTRY">overlay fade 200 ms · core pulse 1.4 s loop</NoteRow>
              <NoteRow label="ERROR">red flash 120 ms · 3× · #E84A4A</NoteRow>
            </NoteBlock>
          </div>
        </div>
      );
    }

    function NoteBlock({ title, children }) {
      return (
        <div>
          <div style={{
            fontFamily: "'Space Grotesk', sans-serif",
            fontSize: 9, color: '#1D9E75',
            letterSpacing: 2.5, fontWeight: 600,
            marginBottom: 6,
            borderBottom: '0.6px solid #1e2535',
            paddingBottom: 4,
          }}>{title}</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 3 }}>
            {children}
          </div>
        </div>
      );
    }

    function NoteRow({ label, children }) {
      return (
        <div style={{
          display: 'grid',
          gridTemplateColumns: '70px 1fr',
          gap: 6,
          fontFamily: "'IBM Plex Mono', monospace",
          fontSize: 8, lineHeight: '13px',
        }}>
          <span style={{ color: '#E8A030', letterSpacing: 0.8, fontWeight: 500 }}>{label}</span>
          <span style={{ color: '#C8CDD8', opacity: 0.85 }}>{children}</span>
        </div>
      );
    }

    /* ============ TITLE BLOCK ============ */

    function TitleBlock() {
      return (
        <div style={{
          position: 'absolute', bottom: 0, left: 0, right: 0,
          height: 52, background: '#1a1e25',
          borderTop: '1.5px solid #2a3040',
          display: 'flex', alignItems: 'center',
          padding: '0 36px', gap: 50,
        }}>
          <div style={{
            fontFamily: "'Space Grotesk', sans-serif",
            fontSize: 14, fontWeight: 700, color: '#1D9E75',
            letterSpacing: 4, textTransform: 'uppercase',
          }}>GPROG</div>
          <div style={{ width: 1, height: 28, background: '#2a3040' }} />
          <div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 10, color: '#C8CDD8', letterSpacing: 1.5,
            }}>GrooveForge Brain — Display UI v1.0 — GPROG / Bogotá / 2026</div>
            <div style={{
              fontFamily: "'IBM Plex Mono', monospace",
              fontSize: 8, color: '#5a6070', letterSpacing: 1, marginTop: 2,
            }}>FIRMWARE TARGET: LVGL 9 · ESP32-S3 · GC9A01 SPI 40 MHz</div>
          </div>
          <div style={{ flex: 1 }} />
          <div style={{ display: 'flex', gap: 30, alignItems: 'center' }}>
            <TBField label="DRAWN" value="GPROG" />
            <TBField label="DATE" value="2026-05-17" />
            <TBField label="SHEET" value="UI / 1 OF 1" />
            <TBField label="DWG NO." value="GFB-UI-001" />
          </div>
        </div>
      );
    }

    function TBField({ label, value }) {
      return (
        <div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 7, color: '#5a6070', letterSpacing: 1,
          }}>{label}</div>
          <div style={{
            fontFamily: "'IBM Plex Mono', monospace",
            fontSize: 9, color: '#C8CDD8', letterSpacing: 0.5, marginTop: 1,
          }}>{value}</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Spec />);
  </script>
</body>
</html>
