[project]
name = "grooveforge-training"
version = "0.1.0"
description = "TinyML training pipeline for GrooveForge Brain"
requires-python = ">=3.11,<3.14"

dependencies = [
    "tensorflow>=2.16",
    "numpy>=1.26",
    "pretty_midi>=0.2.10",
    "librosa>=0.10",
    "mido>=1.3",
    "music21>=9.1",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils", "models", "datasets"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
