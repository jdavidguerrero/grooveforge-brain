[project]
name = "grooveforge-training"
version = "0.1.0"
description = "TinyML training pipeline for GrooveForge Brain"
requires-python = ">=3.11"

dependencies = [
    "tensorflow>=2.14.0",
    "tensorflow-hub>=0.16.0",
    "numpy>=1.26.0",
    "librosa>=0.10.0",
    "mido>=1.3.0",
    "music21>=9.1.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
    "jupyter>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["models", "utils"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.ruff]
line-length = 100
target-version = "py311"
